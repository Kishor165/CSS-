<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gamma Access Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-black:   #07090A;
    --steel:      #1B2320;
    --steel-line: #2E3B36;
    --gamma:      #6BFF6B;
    --gamma-dim:  #2B7A3E;
    --gamma-glow: #9BFFA0;
    --crack:      #0F1512;
    --text-main:  #DDEFE0;
    --text-dim:   #7C9385;
    --danger:     #FF4C4C;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; font-family:'Rajdhani', sans-serif; background:var(--bg-black); color:var(--text-main); overflow:hidden; }

  body{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1400px;
    background:
      radial-gradient(ellipse at 50% 30%, #0F1E14 0%, #07090A 60%),
      linear-gradient(var(--bg-black), var(--bg-black));
  }

  /* ---------- cracked steel floor texture ---------- */
  .floor{
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--steel-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--steel-line) 1px, transparent 1px);
    background-size:46px 46px;
    opacity:.08;
    pointer-events:none;
  }

  /* ---------- gamma particles rising ---------- */
  .spore{
    position:absolute;
    width:3px; height:3px;
    border-radius:50%;
    background:var(--gamma);
    box-shadow:0 0 8px 2px var(--gamma-glow);
    animation:rise var(--dur,8s) linear infinite;
    animation-delay:var(--delay,0s);
    opacity:0;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.8; }
    90%{ opacity:.4; }
    100%{ transform:translateY(-100vh) translateX(var(--drift,20px)); opacity:0; }
  }

  /* ---------- monster silhouette (original design, not any copyrighted character) ---------- */
  .silhouette-wrap{
    position:absolute;
    bottom:0; left:50%;
    transform:translateX(-50%) translateY(4%);
    width:min(640px, 90vw);
    opacity:.9;
    animation:emerge 1.8s cubic-bezier(.2,.8,.2,1) .1s both;
    pointer-events:none;
    filter:drop-shadow(0 0 40px rgba(107,255,107,0.15));
  }
  @keyframes emerge{
    from{ transform:translateX(-50%) translateY(14%); opacity:0; }
    to{ transform:translateX(-50%) translateY(4%); opacity:.9; }
  }
  .silhouette-wrap svg{ width:100%; height:auto; display:block; }
  .eye-glow{
    animation:eyePulse 2.4s ease-in-out infinite;
  }
  @keyframes eyePulse{
    0%,100%{ opacity:.7; }
    50%{ opacity:1; }
  }

  /* ---------- cracked glass overlay lines ---------- */
  .crack-line{
    position:absolute; inset:0;
    pointer-events:none;
    opacity:.5;
  }

  /* ---------- heartbeat monitor strip ---------- */
  .heartbeat{
    position:absolute;
    top:26px; left:50%;
    transform:translateX(-50%);
    width:min(360px, 80vw);
    height:44px;
    z-index:6;
    opacity:.85;
  }
  .heartbeat svg{ width:100%; height:100%; }
  .heartbeat path{
    fill:none;
    stroke:var(--gamma);
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:drop-shadow(0 0 6px var(--gamma));
    stroke-dasharray:600;
    stroke-dashoffset:600;
    animation:pulseLine 2.4s linear infinite;
  }
  @keyframes pulseLine{
    0%{ stroke-dashoffset:600; }
    100%{ stroke-dashoffset:0; }
  }

  /* ---------- card scene ---------- */
  .scene{
    position:relative;
    z-index:5;
    transform-style:preserve-3d;
    animation:cardIn 1s cubic-bezier(.2,.9,.25,1) .5s both;
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(30px) scale(.94); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .card{
    width:min(380px, 88vw);
    padding:46px 34px 32px;
    background:linear-gradient(180deg, rgba(20,28,24,0.85), rgba(10,14,12,0.9));
    border:1px solid var(--gamma-dim);
    clip-path:polygon(0 0, 100% 0, 100% 92%, 94% 100%, 6% 100%, 0 92%);
    box-shadow:
      0 30px 70px -20px rgba(0,0,0,0.8),
      0 0 40px -6px rgba(107,255,107,0.25) inset,
      0 0 60px -10px rgba(107,255,107,0.2);
    transform-style:preserve-3d;
    transition:transform .25s ease-out;
    will-change:transform;
    position:relative;
  }

  .card::before{
    content:'';
    position:absolute;
    inset:0;
    background:
      linear-gradient(115deg, transparent 40%, rgba(107,255,107,0.05) 50%, transparent 60%);
    pointer-events:none;
  }

  .badge{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:14px;
    transform:translateZ(50px);
  }
  .badge .dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--gamma);
    box-shadow:0 0 10px 3px var(--gamma-glow);
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .badge span{
    font-size:.7rem;
    letter-spacing:2px;
    color:var(--gamma);
    text-transform:uppercase;
  }

  h1{
    font-family:'Bebas Neue', sans-serif;
    font-weight:400;
    font-size:2.4rem;
    text-align:center;
    letter-spacing:4px;
    color:var(--gamma-glow);
    text-shadow:0 0 18px rgba(107,255,107,0.6), 0 0 40px rgba(107,255,107,0.25);
    transform:translateZ(40px);
  }

  .sub{
    text-align:center;
    color:var(--text-dim);
    font-size:.82rem;
    letter-spacing:1px;
    margin-top:8px;
    margin-bottom:30px;
    transform:translateZ(30px);
    text-transform:uppercase;
  }

  form{ transform-style:preserve-3d; }

  .field{
    position:relative;
    margin-bottom:20px;
    transform:translateZ(25px);
  }

  .field label{
    display:block;
    font-size:.72rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:6px;
  }

  .field input{
    width:100%;
    padding:13px 14px;
    background:rgba(107,255,107,0.04);
    border:1px solid var(--steel-line);
    border-radius:2px;
    color:var(--text-main);
    font-family:'Rajdhani', sans-serif;
    font-size:1rem;
    letter-spacing:.5px;
    outline:none;
    transition:border-color .25s, box-shadow .25s, background .25s;
  }

  .field input::placeholder{ color:#4C5C53; }

  .field input:focus{
    border-color:var(--gamma);
    background:rgba(107,255,107,0.08);
    box-shadow:0 0 0 3px rgba(107,255,107,0.12);
  }

  .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:.76rem;
    color:var(--text-dim);
    margin-bottom:26px;
    transform:translateZ(20px);
    letter-spacing:.5px;
  }
  .row label{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .row a{ color:var(--gamma); text-decoration:none; }
  .row a:hover{ text-decoration:underline; }

  button.enter{
    width:100%;
    padding:15px;
    border:1px solid var(--gamma);
    background:linear-gradient(135deg, rgba(107,255,107,0.18), rgba(43,122,62,0.25));
    color:var(--gamma-glow);
    font-family:'Bebas Neue', sans-serif;
    font-size:1.05rem;
    letter-spacing:3px;
    text-transform:uppercase;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transform:translateZ(35px);
    clip-path:polygon(4% 0, 100% 0, 96% 100%, 0 100%);
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
    box-shadow:0 0 25px -6px rgba(107,255,107,0.5);
  }

  button.enter:hover{
    transform:translateZ(45px) translateY(-2px);
    background:linear-gradient(135deg, rgba(107,255,107,0.3), rgba(43,122,62,0.35));
    box-shadow:0 0 35px -4px rgba(107,255,107,0.75);
  }
  button.enter:active{ transform:translateZ(35px) translateY(0); }

  .foot{
    text-align:center;
    margin-top:22px;
    font-size:.78rem;
    color:var(--text-dim);
    letter-spacing:.5px;
    transform:translateZ(20px);
  }
  .foot a{ color:var(--gamma); text-decoration:none; font-weight:600; }
  .foot a:hover{ text-decoration:underline; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

  <div class="floor"></div>
  <div id="spores"></div>

  <!-- Heartbeat / gamma monitor strip -->
  <div class="heartbeat">
    <svg viewBox="0 0 360 44" preserveAspectRatio="none">
      <path d="M0,22 L60,22 L75,6 L90,38 L105,14 L120,22 L360,22" />
    </svg>
  </div>

  <!-- Original rage-monster silhouette (not any copyrighted character design) -->
  <div class="silhouette-wrap">
    <svg viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bodyGrad" cx="50%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#16241A"/>
          <stop offset="100%" stop-color="#070B08"/>
        </radialGradient>
      </defs>
      <!-- torso/shoulders -->
      <path d="M120,380 L110,260 Q100,190 150,150 Q180,120 250,118
               Q320,120 350,150 Q400,190 390,260 L380,380 Z" fill="url(#bodyGrad)"/>
      <!-- traps/neck mass -->
      <path d="M190,150 Q250,110 310,150 L300,180 Q250,160 200,180 Z" fill="url(#bodyGrad)"/>
      <!-- head mass (abstract, no facial likeness) -->
      <ellipse cx="250" cy="95" rx="58" ry="62" fill="url(#bodyGrad)"/>
      <!-- brow ridge shading only, no defined face -->
      <path d="M205,90 Q250,72 295,90" stroke="#0C130D" stroke-width="10" fill="none" opacity="0.6"/>
      <!-- glowing eyes suggestion -->
      <ellipse class="eye-glow" cx="228" cy="98" rx="7" ry="4" fill="#6BFF6B"/>
      <ellipse class="eye-glow" cx="272" cy="98" rx="7" ry="4" fill="#6BFF6B"/>
      <!-- muscle striations -->
      <path d="M150,220 Q170,240 150,270" stroke="#0C130D" stroke-width="6" fill="none" opacity="0.5"/>
      <path d="M350,220 Q330,240 350,270" stroke="#0C130D" stroke-width="6" fill="none" opacity="0.5"/>
      <path d="M220,200 Q250,215 280,200" stroke="#0C130D" stroke-width="5" fill="none" opacity="0.4"/>
    </svg>
  </div>

  <div class="scene">
    <div class="card" id="card">
      <div class="badge"><span class="dot"></span><span>Gamma Access Terminal</span></div>

      <h1>UNLEASH</h1>
      <p class="sub">Authorized personnel only</p>

      <form id="loginForm">
        <div class="field">
          <label>Operator ID</label>
          <input type="email" placeholder="agent@gammabase.mil" required />
        </div>
        <div class="field">
          <label>Access Code</label>
          <input type="password" placeholder="••••••••••" required />
        </div>

        <div class="row">
          <label><input type="checkbox" style="accent-color:#6BFF6B;"> Stay logged in</label>
          <a href="#">Reset code</a>
        </div>

        <button type="submit" class="enter">Initiate Access</button>
      </form>

      <p class="foot">Need clearance? <a href="#">Request access</a></p>
    </div>
  </div>

<script>
  // gamma spores rising
  const field = document.getElementById('spores');
  const COUNT = 26;
  for(let i=0;i<COUNT;i++){
    const s = document.createElement('div');
    s.className = 'spore';
    s.style.left = Math.random()*100 + '%';
    s.style.bottom = '-10px';
    s.style.setProperty('--dur', (6 + Math.random()*6).toFixed(2)+'s');
    s.style.setProperty('--delay', (Math.random()*8).toFixed(2)+'s');
    s.style.setProperty('--drift', (Math.random()*80-40)+'px');
    field.appendChild(s);
  }

  // 3D tilt on card
  const card = document.getElementById('card');
  function handleTilt(e){
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const dx = (e.clientX - cx) / (rect.width/2);
    const dy = (e.clientY - cy) / (rect.height/2);
    const maxTilt = 10;
    card.style.transform = `rotateY(${dx*maxTilt}deg) rotateX(${-dy*maxTilt}deg)`;
  }
  function resetTilt(){ card.style.transform = 'rotateY(0deg) rotateX(0deg)'; }
  window.addEventListener('mousemove', handleTilt);
  window.addEventListener('mouseleave', resetTilt);
  window.addEventListener('touchmove', (e)=>{ if(e.touches[0]) handleTilt(e.touches[0]); }, { passive:true });
  window.addEventListener('touchend', resetTilt);

  // form submit demo
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const btn = this.querySelector('.enter');
    const original = btn.textContent;
    btn.textContent = 'SCANNING...';
    setTimeout(() => { btn.textContent = original; }, 1800);
  });
</script>
</body>
</html>
